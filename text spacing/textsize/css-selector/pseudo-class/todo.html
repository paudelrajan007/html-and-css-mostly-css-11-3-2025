<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Todo List</title>

    <style>
      * {
        box-sizing: border-box;
        font-family: Arial, sans-serif;
      }

      body {
        background: #f4f4f4;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }

      .todo-container {
        background: #fff;
        padding: 20px;
        width: 320px;
        border-radius: 8px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      }

      h1 {
        text-align: center;
        margin-bottom: 15px;
      }

      .input-section {
        display: flex;
        gap: 5px;
      }

      input {
        flex: 1;
        padding: 8px;
      }

      button {
        padding: 8px 12px;
        cursor: pointer;
      }

      ul {
        list-style: none;
        padding: 0;
        margin-top: 15px;
      }

      li {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 8px;
        margin-bottom: 5px;
        background: #eee;
        border-radius: 4px;
        cursor: pointer;
      }

      li.completed {
        text-decoration: line-through;
        color: gray;
      }

      .delete-btn {
        background: red;
        color: white;
        border: none;
        padding: 4px 8px;
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <div class="todo-container">
      <h1>Todo List</h1>

      <div class="input-section">
        <input type="text" id="taskInput" placeholder="Add a task..." />
        <button onclick="addTask()">Add</button>
      </div>

      <ul id="taskList"></ul>
    </div>

    <script>
      function addTask() {
        const input = document.getElementById("taskInput");
        const taskText = input.value.trim();

        if (taskText === "") return;

        const li = document.createElement("li");
        li.textContent = taskText;

        li.onclick = function () {
          li.classList.toggle("completed");
        };

        const deleteBtn = document.createElement("button");
        deleteBtn.textContent = "X";
        deleteBtn.className = "delete-btn";

        deleteBtn.onclick = function (e) {
          e.stopPropagation();
          li.remove();
        };

        li.appendChild(deleteBtn);
        document.getElementById("taskList").appendChild(li);

        input.value = "";
      }
    </script>
  </body>
</html>
