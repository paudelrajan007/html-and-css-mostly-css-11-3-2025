<!DOCTYPE html>
<html>
  <body>
    <h2 id="status">The light is OFF</h2>

    <button onclick="lightOn()">ON</button>
    <button onclick="lightOff()">OFF</button>

    <script>
      function lightOn() {
        document.getElementById("status").innerText = "The light is ON";
        document.body.style.background = "yellow";
      }

      function lightOff() {
        document.getElementById("status").innerText = "The light is OFF";
        document.body.style.background = "white";
      }
    </script>
  </body>
</html>
