<!DOCTYPE html>
<html>
  <head>
    <title>HTML Layout Example</title>
  </head>
  <body>
    <header>
      <h1>My Website</h1>
    </header>

    <nav>
      <a href="#">Home</a> | <a href="#">About</a> |
      <a href="#">Contact</a>
    </nav>

    <section>
      <h2>Main Content</h2>
      <p>This is the main area of the webpage.</p>
    </section>

    <aside>
      <h3>Side Content</h3>
      <p>Links, ads, or extra info goes here.</p>
    </aside>

    <footer>
      <p>© 2025 MyWebsite.com</p>
    </footer>
  </body>
</html>
